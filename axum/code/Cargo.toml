[package]
name = "axum_lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

resolver = "3"

[dependencies]
axum = "0.8"
http-body-util = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
